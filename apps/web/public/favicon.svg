<!--
  The AegisAI mark, as a favicon.

  Same geometry as components/brand/Logo.tsx, drawn on its own ground because
  a tab strip has no theme to inherit from — it sits on whatever chrome the
  browser paints, so the mark carries its own dark plate rather than relying
  on `currentColor` the way the in-app component does.

  Stroke weights are heavier than the component's: at 16px the 1.6px strokes
  that read correctly at 20px disappear.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <rect width="24" height="24" rx="5" fill="#0c0e11"/>
  <path
    d="M12 3.6 18.9 6.05v5.6c0 3.98-2.7 7.28-6.9 8.55-4.2-1.27-6.9-4.57-6.9-8.55v-5.6L12 3.6Z"
    fill="none" stroke="#e8eaed" stroke-width="1.7" stroke-linejoin="round"/>
  <path
    d="M8.9 13.7 11.2 11.1l1.7 1.85 2.5-3.2"
    fill="none" stroke="#4d8dff" stroke-width="1.9"
    stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="15.4" cy="9.75" r="1.15" fill="#4d8dff"/>
</svg>
