# Alembic configuration — task 1.5.
#
# The database URL is deliberately NOT here. `sqlalchemy.url` in this file would
# be a credential in git the first time someone pointed it at a real Postgres,
# and this repository's one bragging right on secrets is that none has ever
# entered its history. `env.py` reads DATABASE_URL from the environment, or
# `-x url=...` for a one-off:
#
#   DATABASE_URL=postgresql+psycopg://aegis:...@localhost/aegis alembic upgrade head
#   alembic -x url=sqlite:///aegis.db upgrade head
#
# There is nothing to migrate on the zero-setup ephemeral database: it is
# created by `create_all` at startup and deleted when the process exits.

[alembic]
script_location = services/api/migrations
prepend_sys_path = .
# `os` = split path options on the OS path separator. Names the behaviour
# explicitly; without it Alembic falls back to legacy splitting on spaces,
# commas *and* colons, which mangles any absolute path on Windows.
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
