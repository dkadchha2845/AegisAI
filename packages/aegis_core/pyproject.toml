# The shared domain vocabulary: scam-stage taxonomy, victim-state schema,
# entity substitution, Hinglish handling, and the generation backends.
#
# It is a real installable package rather than a directory on sys.path because
# both the API and the dataset pipeline import it, and the previous arrangement
# (seven `sys.path.insert` calls pointing at ml/) failed silently: the import
# sites fall back to a hardcoded copy of the taxonomy, so a broken path did not
# raise — it quietly served stale labels with no threat weights at all.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-core"
version = "0.1.0"
description = "AegisAI shared domain: scam taxonomy, entity vocabulary, Hinglish handling."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["aegis_core*"]
