# The checks that must pass before anything lands on main.
#
# The point of running them here is the contract. Python and TypeScript can
# drift apart in a commit that passes review and imports cleanly on both sides —
# the failure only surfaces later as a blank panel in the UI. Catching that on
# push means the other person never pulls a broken main and spends an hour
# assuming they broke it themselves.
#
# Locally, `make gates` runs the same four:
#   .venv/bin/python -m pytest services/api/tests -q
#   .venv/bin/python schema/check_contract.py
#   npm run typecheck --prefix apps/web
#   npm run build --prefix apps/web

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast feedback: style and types fail in seconds, before anything installs torch.
  lint:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.txt

      - name: Install tooling
        run: pip install ruff mypy

      # Curated toward defects rather than opinions — see pyproject.toml for
      # why each ignored rule is ignored. The gate is kept at zero findings so
      # a new violation is visible.
      - name: Lint
        run: ruff check .

      # Scoped to the agent layer, where typed contracts actually buy
      # something: every agent implements one protocol and returns one shape.
      - name: Types
        run: |
          pip install -r services/api/requirements.txt
          mypy

  backend:
    name: backend (py${{ matrix.python }})
    runs-on: ubuntu-latest

    # Task 1.8's queue tests skip without a broker, and a test that passes by
    # not running is the thing task 1.7b is about. Redis is one service
    # container and a few seconds, so the Redis-backed journal, the cost-class
    # routing at the transport, and the dead-letter list are actually exercised
    # here rather than only on a developer's machine with `make up`.
    #
    # The API's own behaviour is unaffected: `conftest.py` pins AEGIS_QUEUE=0 so
    # every other test still runs the in-process path, and the step below proves
    # the no-broker shape too.
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    strategy:
      fail-fast: false
      matrix:
        # Both ends of the range the README claims. Claiming 3.11+ and only ever
        # running 3.12 is how the floor quietly rots. The floor is 3.11 because
        # LangGraph (the Phase-1 orchestrator) requires it.
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: services/api/requirements.txt

      # Installs the editable aegis-core alongside the runtime deps. Path
      # dependencies in requirements.txt resolve against the working directory,
      # which is the repo root here.
      - name: Install
        run: |
          pip install -r services/api/requirements.txt
          # Test tooling, deliberately not in the runtime requirements: the
          # service should not ship a coverage plugin. Installed here because
          # the coverage gate runs in this job.
          pip install pytest-cov

      # No checkpoint on the runner, and that is the point: this asserts the
      # documented clean-clone path — lexical classifier, BM25 retrieval, no
      # Docker stack, and a service that still answers.
      - name: Verdict regressions + coverage gate
        run: pytest services/api/tests --cov --cov-report=term

      # The other half of 1.8's degradation invariant: with no broker the API
      # must still answer and run the graph in its own process. Pointed at a
      # closed port rather than by stopping the service, so this asserts the
      # code path and not the runner's networking.
      - name: The same job tests with no broker at all
        env:
          AEGIS_REDIS_URL: redis://127.0.0.1:6399/0
        run: |
          pytest services/api/tests/test_jobs_dispatch.py \
                 services/api/tests/test_jobs_journal.py \
                 services/api/tests/test_jobs_worker.py -q

      # Task 1.7b. The step above ran against whichever classifier this runner
      # has, and that is always the lexical fallback: ml/artifacts/ is
      # gitignored and nothing here exports a checkpoint. So a green backend job
      # proves the fallback, not what the application serves — which is exactly
      # how 1.7 was ticked on the false positive 1.7a then had to fix.
      #
      # Asserting the state rather than leaving it implied means the day 4.9
      # puts a promoted checkpoint on the runner this fails, and someone has to
      # decide what the gates require, instead of the suite quietly changing
      # what it proves.
      - name: Which classifier did the gates prove?
        run: python -m services.api.serving --require fallback

      - name: Contract drift (Python <-> TypeScript)
        run: python schema/check_contract.py

      # Two boots, because this job now has exactly one piece of infrastructure
      # and the interesting assertions are different on each side of that.
      #
      # With the Redis service reachable the API switches to the queue, and
      # nothing on this runner consumes it — which is the one queue state that
      # must be loud, so `queue:no_workers` is asserted rather than hoped for.
      # With the broker pointed at a closed port every store is unreachable and
      # the service must still answer, which is the documented clean-clone path
      # and the degradation invariant.
      #
      # An earlier version of this step asserted "no store is reachable" while a
      # Redis service container was attached to the same job. It was wrong about
      # its own environment, and it turned main red.
      - name: API boots against the broker, and knows nobody is consuming it
        run: |
          python -m uvicorn services.api.main:app --port 8011 &
          for _ in $(seq 1 60); do
            curl -sf localhost:8011/api/health >/dev/null && break
            sleep 0.5
          done
          curl -sf localhost:8011/api/health | python -c '
          import json, sys
          h = json.load(sys.stdin)
          assert h["ok"], h
          assert h["contract_version"] == 1, h
          assert h["twin"]["fitted"], "twin did not fit - is transitions.json committed?"
          assert h["coach"]["lines"] > 0, "coach library is empty"
          assert h["retrieval"]["chunks"] > 0, "knowledge base loaded nothing"
          infra = h["infrastructure"]
          assert set(infra) == {"postgres", "neo4j", "qdrant", "redis"}, infra
          assert infra["redis"]["reachable"] is True, infra["redis"]
          assert not any(infra[n]["reachable"] for n in ("postgres", "neo4j", "qdrant")), infra
          ex = h["execution"]
          assert ex["mode"] == "worker", ex
          assert ex["broker_reachable"] is True, ex
          assert ex["workers"] == 0, ex
          assert ex["degraded"] == ["queue:no_workers"], ex
          assert "queue:no_workers" in h["degraded"], h["degraded"]
          assert "@" not in ex["broker"], "a broker credential reached /api/health"
          # 1.7b: the same pin, on the served endpoint rather than in-process.
          clf = h["classifier"]
          assert clf["serving_best"] is False, ("a promoted checkpoint is serving on CI - see 1.7b", clf)
          assert "clf:lexical_fallback" in h["degraded"], h["degraded"]
          print("health ok:", clf["backend"], "|", clf["reason"])
          print("degraded:", h["degraded"])
          '
          kill %1 || true

      - name: API boots with no infrastructure at all
        env:
          # The port, not AEGIS_REDIS_URL. The broker takes its URL from the
          # host/port pair when no URL is set, and `stores/probe.py` reads the
          # same pair -- so moving the port moves both, and the service
          # container genuinely disappears from this boot's point of view.
          # Setting only the URL would leave `infrastructure.redis` still
          # pointed at 6379, where the service container is answering.
          AEGIS_REDIS_PORT: "6399"
        run: |
          python -m uvicorn services.api.main:app --port 8012 &
          for _ in $(seq 1 60); do
            curl -sf localhost:8012/api/health >/dev/null && break
            sleep 0.5
          done
          curl -sf localhost:8012/api/health | python -c '
          import json, sys
          h = json.load(sys.stdin)
          assert h["ok"], h
          infra = h["infrastructure"]
          assert not any(s["reachable"] for s in infra.values()), infra
          # 1.8: with no broker the graph runs in this process, and that is the
          # documented zero-setup path rather than a degradation.
          ex = h["execution"]
          assert ex["mode"] == "in-process", ex
          assert ex["broker_reachable"] is False, ex
          assert ex["degraded"] == [], ex
          assert "queue:no_workers" not in h["degraded"], h["degraded"]
          print("no-infrastructure health ok; degraded:", h["degraded"])
          '
          kill %1 || true

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci
        working-directory: apps/web

      - name: Typecheck
        run: npm run typecheck
        working-directory: apps/web

      # Typecheck passing does not mean it bundles. Vite resolves the `@/` alias
      # and the three/GSAP imports at build time, not at tsc time.
      - name: Build
        run: npm run build
        working-directory: apps/web

  # Advisory, not blocking. A transitive CVE with no patch available should
  # inform a decision, not stop an unrelated PR from merging — but it must be
  # visible, because "nobody looked" is how a known hole ships.
  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r services/api/requirements.txt --strict || true

      - name: npm audit
        run: npm audit --audit-level=high || true
        working-directory: apps/web
