# The checks that must pass before anything lands on main.
#
# The point of running them here is the contract. Python and TypeScript can
# drift apart in a commit that passes review and imports cleanly on both sides —
# the failure only surfaces later as a blank panel in the UI. Catching that on
# push means the other person never pulls a broken main and spends an hour
# assuming they broke it themselves.
#
# Locally, `make gates` runs the same four:
#   .venv/bin/python -m pytest services/api/tests -q
#   .venv/bin/python schema/check_contract.py
#   npm run typecheck --prefix apps/web
#   npm run build --prefix apps/web

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast feedback: style and types fail in seconds, before anything installs torch.
  lint:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.txt

      - name: Install tooling
        run: pip install ruff mypy

      # Curated toward defects rather than opinions — see pyproject.toml for
      # why each ignored rule is ignored. The gate is kept at zero findings so
      # a new violation is visible.
      - name: Lint
        run: ruff check .

      # Scoped to the agent layer, where typed contracts actually buy
      # something: every agent implements one protocol and returns one shape.
      - name: Types
        run: |
          pip install -r services/api/requirements.txt
          mypy

  backend:
    name: backend (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the range the README claims. Claiming 3.11+ and only ever
        # running 3.12 is how the floor quietly rots. The floor is 3.11 because
        # LangGraph (the Phase-1 orchestrator) requires it.
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: services/api/requirements.txt

      # Installs the editable aegis-core alongside the runtime deps. Path
      # dependencies in requirements.txt resolve against the working directory,
      # which is the repo root here.
      - name: Install
        run: |
          pip install -r services/api/requirements.txt
          # Test tooling, deliberately not in the runtime requirements: the
          # service should not ship a coverage plugin. Installed here because
          # the coverage gate runs in this job.
          pip install pytest-cov

      # No checkpoint on the runner, and that is the point: this asserts the
      # documented clean-clone path — lexical classifier, BM25 retrieval, no
      # Docker stack, and a service that still answers.
      - name: Verdict regressions + coverage gate
        run: pytest services/api/tests --cov --cov-report=term

      # Task 1.7b. The step above ran against whichever classifier this runner
      # has, and that is always the lexical fallback: ml/artifacts/ is
      # gitignored and nothing here exports a checkpoint. So a green backend job
      # proves the fallback, not what the application serves — which is exactly
      # how 1.7 was ticked on the false positive 1.7a then had to fix.
      #
      # Asserting the state rather than leaving it implied means the day 4.9
      # puts a promoted checkpoint on the runner this fails, and someone has to
      # decide what the gates require, instead of the suite quietly changing
      # what it proves.
      - name: Which classifier did the gates prove?
        run: python -m services.api.serving --require fallback

      - name: Contract drift (Python <-> TypeScript)
        run: python schema/check_contract.py

      - name: API boots and reports its own health
        run: |
          python -m uvicorn services.api.main:app --port 8011 &
          for _ in $(seq 1 60); do
            curl -sf localhost:8011/api/health >/dev/null && break
            sleep 0.5
          done
          curl -sf localhost:8011/api/health | python -c '
          import json, sys
          h = json.load(sys.stdin)
          assert h["ok"], h
          assert h["contract_version"] == 1, h
          assert h["twin"]["fitted"], "twin did not fit - is transitions.json committed?"
          assert h["coach"]["lines"] > 0, "coach library is empty"
          assert h["retrieval"]["chunks"] > 0, "knowledge base loaded nothing"
          # No compose stack on the runner: every store must report unreachable
          # and the service must still be ok. This is the degradation invariant,
          # asserted rather than assumed.
          infra = h["infrastructure"]
          assert set(infra) == {"postgres", "neo4j", "qdrant", "redis"}, infra
          assert not any(s["reachable"] for s in infra.values()), infra
          # 1.7b: the same pin, on the served endpoint rather than in-process.
          clf = h["classifier"]
          assert clf["serving_best"] is False, ("a promoted checkpoint is serving on CI - see 1.7b", clf)
          assert "clf:lexical_fallback" in h["degraded"], h["degraded"]
          print("health ok:", clf["backend"], "|", clf["reason"])
          print("degraded:", h["degraded"])
          '

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci
        working-directory: apps/web

      - name: Typecheck
        run: npm run typecheck
        working-directory: apps/web

      # Typecheck passing does not mean it bundles. Vite resolves the `@/` alias
      # and the three/GSAP imports at build time, not at tsc time.
      - name: Build
        run: npm run build
        working-directory: apps/web

  # Advisory, not blocking. A transitive CVE with no patch available should
  # inform a decision, not stop an unrelated PR from merging — but it must be
  # visible, because "nobody looked" is how a known hole ships.
  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r services/api/requirements.txt --strict || true

      - name: npm audit
        run: npm audit --audit-level=high || true
        working-directory: apps/web
