# Tooling config for the AegisAI backend. Not a package — `packages/aegis_core`
# has its own pyproject and is the only installable distribution here.

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    ".venv", "ml/.venv", "ml/artifacts", "node_modules",
    "apps/web", "docs/archive", "ui-design", "attached_assets",
    # Vendored third-party skill packages, checked in whole. Not ours to lint
    # or to fix: 424 findings, none of them in code this project wrote, and a
    # gate that reports 424 known-irrelevant errors is a gate nobody reads.
    "Skills",
    # Jupyter: cell-scoped rules (import placement, semicolons) do not
    # describe notebook style, and the notebook is Colab-executed anyway.
    "*.ipynb",
]

[tool.ruff.lint]
# Curated toward defects, not opinions. The default set is dominated here by
# pyupgrade style (≈390 findings: `Dict` -> `dict`, `Optional[X]` -> `X | None`)
# which is real but cosmetic, and by B008, which flags FastAPI's own
# `Depends()`/`File()` idiom on every route. Enabling those wholesale would
# bury the handful of findings that are actual bugs.
select = [
    "E4", "E7", "E9",  # pycodestyle errors that indicate real problems
    "F",               # pyflakes — undefined names, unused imports, dead code
    "B",               # bugbear — mutable defaults, misuse of except, etc.
    "I",               # import sorting
    "DTZ",             # naive datetimes; we were bitten by utcnow() in 0.2
    "S",               # bandit security rules
    "PIE", "SIM", "RUF",
]
ignore = [
    # FastAPI's dependency-injection idiom is a function call in a default
    # argument, by design: `def route(x = Depends(...))`. Flagging it is 65
    # false positives on our routes and zero true ones.
    "B008",
    # Broad `except Exception` is load-bearing here: the degradation invariant
    # requires every optional capability to fall back rather than propagate.
    # Each site logs and tags; see engine/classifier.py, rag/store.py.
    "BLE001",
    # Same reason — a probe that cannot connect is information, not an error.
    "S110",
    # Assert is how tests assert.
    "S101",
    # Line length is enforced by the formatter, not the linter.
    "E501",
    # `random` here seeds corpus generation, not crypto.
    "S311",
    # Subprocess use is confined to tooling, reviewed case by case.
    "S603", "S607",

    # --- Style-only, deliberately not enforced on inherited code -----------
    # Each of these was reviewed across all its call sites and found to have no
    # defect value here. The gate is kept at zero findings so a NEW violation is
    # visible; padding it with 50 known-benign warnings would defeat that.
    #
    # `l` as a loop variable over labels, in ~8 numeric loops. Renaming touches
    # scoring code for no behavioural gain.
    "E741",
    # zip(strict=) would be stricter, but every call site here zips sequences
    # built together in the same function, where a length mismatch is not a
    # reachable state.
    "B905", "RUF007",
    # `raise ... from` inside the LLM backends. The chained cause is noise in a
    # user-facing GenerationError whose whole purpose is to be caught and
    # degraded from.
    "B904",
    # En-dashes and other typography in user-facing strings are intentional.
    "RUF001", "RUF002",
    # Unpacking/concat style.
    "RUF005", "B007",
    # `PASS = "PASS"` is a Verdict enum member, and DEMO_PASSWORD is a
    # documented demo constant already shown on the login screen. Neither is a
    # secret; both are flagged by pattern, not by fact.
    "S105",
    # db.py keeps a NamedTemporaryFile handle open on purpose — closing it
    # would delete the ephemeral SQLite database it points at.
    "SIM115", "SIM105",
    "PIE810",
]

[tool.ruff.lint.per-file-ignores]
# Scripts intentionally configure sys.path before importing, so their imports
# cannot all sit at the top of the file.
"ml/**" = ["E402"]
"schema/**" = ["E402"]
"services/api/tests/**" = ["S105", "S106"]  # hardcoded test passwords

[tool.ruff.lint.isort]
known-first-party = ["services", "schema", "ml", "aegis_core"]

[tool.ruff.format]
# Configured but NOT yet enforced repo-wide: a formatting pass would rewrite
# ~4,100 lines across code whose git blame is currently useful. No formatting
# gate has been adopted, and none is named here on purpose: an earlier version
# of this comment pointed at a make target that was never written, and a reader
# who skims a comment types the command in it. Run `ruff format --check` on the
# files you touch when formatting is relevant.
quote-style = "double"

[tool.mypy]
python_version = "3.12"
# The agent layer's whole value is that every agent returns one typed shape, so
# mypy follows imports into `schema/`. Without pydantic's own plugin it then
# reports `Field(default_factory=Model)` as an error — a known false positive
# from the overloads on `Field()`, not a defect in the contract.
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
# Strictness is scoped to new code. Retrofitting annotations across the
# inherited engine is a large change with no defect-finding payoff today; the
# agent layer is where typed contracts actually buy something, because every
# agent implements one protocol and returns one shape.
files = [
    "services/api/agents",
    "services/api/investigations",
    "services/api/jobs",
    "services/api/orchestration",
    "services/api/stores",
    "services/worker",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# The inherited engine and the retrieval layer became *reachable* from the typed
# layer in task 1.6, when `investigations/report.py` started reusing the evidence
# package's disclaimer and reporting guidance rather than re-wording them. They
# are still not part of what this gate covers, for the reason above. `silent`
# keeps their types available — so the new code is genuinely checked against
# them — while leaving their own 10 pre-existing errors out of a gate that is
# kept at zero precisely so a new one is visible.
module = ["services.api.engine.*", "services.api.rag.*"]
follow_imports = "silent"

[[tool.mypy.overrides]]
# Celery and kombu ship no type information and have no maintained stubs. Task
# 1.8 touches them in exactly two places — the app configuration and the two
# task decorators — and both are asserted by `test_jobs_worker.py`, which is a
# better check on a configuration table than a type would be.
module = ["celery.*", "kombu.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# reportlab ships no type information, and `types-reportlab` is not a dependency
# worth adding for one optional PDF path that already degrades to a 503.
module = ["reportlab.*"]
ignore_missing_imports = true


[tool.pytest.ini_options]
testpaths = ["services/api/tests"]
addopts = "-q"
filterwarnings = [
    # starlette's testclient asks for httpx2; not ours to fix.
    "ignore::DeprecationWarning:starlette.*",
    # NOTE: langgraph's import-time warning is NOT filtered here, because it
    # cannot be. langchain-core calls surface_langchain_deprecation_warnings(),
    # which prepends its own "default" filter for its warning categories, and
    # that beats anything configured beforehand — `-W ignore:...` on the command
    # line does not suppress it either. It is silenced at our own import site
    # instead; see services/api/orchestration/graph.py.
]

[tool.coverage.run]
source = ["services/api"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
# A ratchet, not a target. 65 is just below the measured floor (66%) so noise
# cannot redden CI; raise it whenever the real number climbs, never lower it.
#
# The plan asked for 70. It is not met, and the reason is worth stating rather
# than hiding: `services/api/engine/features/` is 601 statements at 0%. It is
# research-track code imported only by ml/training/rssie/dataset.py, never by
# the serving path, so the API suite legitimately never touches it. Omitting it
# would show ~76% and tell you less. It stays visible until Phase 1 decides
# whether it becomes agents or is retired — see docs/TASKS.md 1.7.
fail_under = 65
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
